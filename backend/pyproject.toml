[tool.poetry]
name = "optifreight-backend"
version = "1.0.0"
description = "OptiFreight AI FastAPI backend"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.111.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.30"}
alembic = ">=1.13.2"
asyncpg = ">=0.29.0"
psycopg = {extras = ["binary"], version = ">=3.1.0"}
geoalchemy2 = ">=0.15.2"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.1"
email-validator = ">=2.1.1"
argon2-cffi = ">=23.1.0"
PyJWT = {extras = ["crypto"], version = ">=2.8.0"}
python-dotenv = ">=1.0.1"
requests = ">=2.32.3"
pandas = ">=2.2.0"
numpy = ">=1.26.4"
lightgbm = ">=4.3.0"
shap = ">=0.45.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-asyncio = ">=0.23.7"
httpx = ">=0.27.0"
